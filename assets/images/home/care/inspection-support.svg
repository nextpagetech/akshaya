<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
<title id="t">Inspection support</title><desc id="d">A technician checks the finished floor while scan markers highlight review points.</desc>
<style>.t{font:700 24px Inter,Arial;fill:#12384b}.s{font:500 15px Inter,Arial;fill:#5c7380}.h{font:700 14px Inter,Arial;fill:#12384b}
.scan{animation:scan 2s ease-in-out infinite alternate}.ring{animation:ring 1.6s ease-out infinite}.b{animation-delay:.45s}.c{animation-delay:.9s}
@keyframes scan{from{transform:translateX(0)}to{transform:translateX(430px)}}@keyframes ring{from{r:9;opacity:1}to{r:32;opacity:0}}</style>
<rect width="960" height="540" rx="28" fill="#f7fbfd"/><text class="t" x="48" y="52">02 · Inspection Support</text><text class="s" x="48" y="82">Review the condition of the completed floor and identify areas that need attention.</text>
<g transform="translate(55 120)">
<polygon points="65,60 760,30 820,340 110,375" fill="#d7e4e8" stroke="#aec3cd" stroke-width="2"/>
<g transform="translate(120 100)"><circle cx="30" cy="18" r="17" fill="#efc7a8"/><rect x="5" y="38" width="50" height="76" rx="14" fill="#dfff31"/><rect x="10" y="90" width="40" height="70" rx="8" fill="#173d59"/><rect x="58" y="55" width="55" height="42" rx="5" fill="#e5eef1" stroke="#174e68" stroke-width="3"/></g>
<rect class="scan" x="235" y="80" width="8" height="245" fill="#5bd3eb" opacity=".85"/>
<g><circle cx="410" cy="210" r="9" fill="#f2b721"/><circle class="ring" cx="410" cy="210" r="9" fill="none" stroke="#f2b721" stroke-width="3"/></g>
<g><circle cx="565" cy="285" r="9" fill="#f2b721"/><circle class="ring b" cx="565" cy="285" r="9" fill="none" stroke="#f2b721" stroke-width="3"/></g>
<g><circle cx="705" cy="185" r="9" fill="#f2b721"/><circle class="ring c" cx="705" cy="185" r="9" fill="none" stroke="#f2b721" stroke-width="3"/></g>
<text class="h" x="460" y="350">REVIEW POINTS</text>
</g></svg>