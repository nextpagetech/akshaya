<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
<title id="t">Correct system selection</title><desc id="d">Surface, moisture and traffic assessment factors converge into the selected flooring system.</desc>
<style>.t{font:700 24px Inter,Arial;fill:#12384b}.s{font:500 15px Inter,Arial;fill:#5c7380}.h{font:700 14px Inter,Arial;fill:#12384b}
.in{animation:in 4.8s ease-in-out infinite}.b{animation-delay:1.1s}.c{animation-delay:2.2s}.choice{animation:choice 1.8s ease-in-out infinite}
@keyframes in{0%,15%,100%{opacity:.45}25%,42%{opacity:1;filter:drop-shadow(0 0 10px #65cbe3)}}@keyframes choice{50%{filter:drop-shadow(0 0 14px #f2b721)}}
</style>
<rect width="960" height="540" rx="28" fill="#f7fbfd"/><text class="t" x="48" y="52">04 · Correct System Selection</text><text class="s" x="48" y="82">Bring the assessment together and match site conditions to the appropriate flooring approach.</text>
<g transform="translate(80 135)">
<g class="in a"><rect x="0" y="15" width="190" height="80" rx="14" fill="#fff" stroke="#a8cad8"/><text class="h" x="95" y="50" text-anchor="middle">SURFACE</text><text class="s" x="95" y="72" text-anchor="middle">Condition</text></g>
<g class="in b"><rect x="0" y="125" width="190" height="80" rx="14" fill="#fff" stroke="#a8cad8"/><text class="h" x="95" y="160" text-anchor="middle">MOISTURE</text><text class="s" x="95" y="182" text-anchor="middle">Site reading</text></g>
<g class="in c"><rect x="0" y="235" width="190" height="80" rx="14" fill="#fff" stroke="#a8cad8"/><text class="h" x="95" y="270" text-anchor="middle">TRAFFIC</text><text class="s" x="95" y="292" text-anchor="middle">Loads and use</text></g>
<path d="M205 55C350 55 360 155 500 155M205 165H500M205 275C350 275 360 175 500 175" fill="none" stroke="#27a9da" stroke-width="4"/>
<g class="choice"><rect x="500" y="95" width="280" height="145" rx="18" fill="#123f58" stroke="#f2b721" stroke-width="3"/><text x="640" y="135" text-anchor="middle" font-size="16" font-weight="700" fill="#9fe7f4">SELECTED FLOORING SYSTEM</text><g transform="translate(560 155)"><rect width="160" height="18" rx="4" fill="#6baac0"/><rect y="22" width="160" height="18" rx="4" fill="#b7cbd4"/><rect y="44" width="160" height="26" rx="4" fill="#dbe4e8"/></g></g>
</g></svg>