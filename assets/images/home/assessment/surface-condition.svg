<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
<title id="t">Surface condition inspection</title><desc id="d">A technician inspects cracks, worn coating and damaged floor areas before system selection.</desc>
<style>
.t{font:700 24px Inter,Arial;fill:#12384b}.s{font:500 15px Inter,Arial;fill:#5c7380}.lab{font:700 13px Inter,Arial;fill:#12384b}
.scan{animation:scan 2s linear infinite}.pulse{animation:pulse 1.6s ease-out infinite}.mark{animation:mark 2.8s ease-in-out infinite}
@keyframes scan{from{transform:translateX(-170px)}to{transform:translateX(700px)}}@keyframes pulse{0%{r:8;opacity:1}100%{r:30;opacity:0}}@keyframes mark{50%{filter:drop-shadow(0 0 10px #f2b721)}}
</style>
<rect width="960" height="540" rx="28" fill="#f7fbfd"/><text class="t" x="48" y="52">01 · Surface Condition</text>
<text class="s" x="48" y="82">Inspect cracks, worn coating, joints and damaged areas before recommending a system.</text>
<g transform="translate(55 120)">
<polygon points="80,40 790,20 840,335 120,370" fill="#dfe5e8" stroke="#b6c8d0" stroke-width="2"/>
<path d="M190 250l70-40 50 48 58-70 74 86 62-56 62 51 88-74" fill="none" stroke="#67777f" stroke-width="6"/>
<path d="M520 250c55-22 88-18 135-2s72 5 103-6" fill="none" stroke="#9ca9af" stroke-width="22" opacity=".42"/>
<g transform="translate(120 95)"><circle cx="28" cy="20" r="17" fill="#efc7a8"/><rect x="4" y="38" width="48" height="78" rx="14" fill="#dfff31"/><rect x="9" y="86" width="38" height="65" rx="8" fill="#173d59"/><rect x="53" y="55" width="58" height="38" rx="6" fill="#194f6c"/><rect x="61" y="63" width="42" height="22" rx="3" fill="#aee9f5"/></g>
<g class="mark"><circle cx="382" cy="232" r="8" fill="#f2b721"/><circle class="pulse" cx="382" cy="232" r="8" fill="none" stroke="#f2b721" stroke-width="3"/><text class="lab" x="405" y="228">CRACK</text></g>
<g class="mark"><circle cx="668" cy="262" r="8" fill="#f2b721"/><circle class="pulse" cx="668" cy="262" r="8" fill="none" stroke="#f2b721" stroke-width="3"/><text class="lab" x="690" y="258">WORN COATING</text></g>
<rect class="scan" x="80" y="40" width="110" height="330" fill="url(#g)" opacity=".5"/>
<defs><linearGradient id="g"><stop stop-color="#65cbe3" stop-opacity="0"/><stop offset=".5" stop-color="#65cbe3" stop-opacity=".55"/><stop offset="1" stop-color="#65cbe3" stop-opacity="0"/></linearGradient></defs>
</g></svg>