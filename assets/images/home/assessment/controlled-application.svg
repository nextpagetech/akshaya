<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
<title id="t">Controlled application</title><desc id="d">Workers prepare and apply the floor coating in a controlled zone with visible application progress.</desc>
<style>.t{font:700 24px Inter,Arial;fill:#12384b}.s{font:500 15px Inter,Arial;fill:#5c7380}.h{font:700 14px Inter,Arial;fill:#12384b}.sweep{animation:sweep 2.3s ease-in-out infinite}.worker{animation:bob 1.8s ease-in-out infinite alternate}
@keyframes sweep{from{transform:translateX(-180px)}to{transform:translateX(520px)}}@keyframes bob{to{transform:translateY(-6px)}}</style>
<rect width="960" height="540" rx="28" fill="#f7fbfd"/><text class="t" x="48" y="52">05 · Controlled Application</text><text class="s" x="48" y="82">Prepare, apply and verify the flooring system in a clearly controlled work zone.</text>
<g transform="translate(60 120)">
<polygon points="70,60 760,30 820,340 110,375" fill="#dce5e9" stroke="#aec3cd" stroke-width="2"/>
<polygon points="345,95 735,80 775,315 365,335" fill="#76a8bb" opacity=".85"/>
<g class="worker" transform="translate(205 125)"><circle cx="25" cy="18" r="17" fill="#efc7a8"/><rect x="2" y="38" width="48" height="76" rx="14" fill="#dfff31"/><rect x="8" y="88" width="38" height="70" rx="8" fill="#173d59"/><path d="M45 83l75 95" stroke="#173d59" stroke-width="8"/><path d="M115 178h72" stroke="#173d59" stroke-width="7"/></g>
<g class="worker" transform="translate(600 115)"><circle cx="25" cy="18" r="17" fill="#efc7a8"/><rect x="2" y="38" width="48" height="76" rx="14" fill="#dfff31"/><rect x="8" y="88" width="38" height="70" rx="8" fill="#173d59"/><path d="M3 82l-65 72" stroke="#173d59" stroke-width="8"/><path d="M-68 154h-55" stroke="#173d59" stroke-width="7"/></g>
<rect class="sweep" x="310" y="90" width="120" height="245" fill="url(#g)" opacity=".65"/>
<defs><linearGradient id="g"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<text class="h" x="490" y="350">APPLICATION PROGRESS</text>
</g></svg>