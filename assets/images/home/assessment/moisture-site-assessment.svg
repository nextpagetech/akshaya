<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
<title id="t">Moisture and site assessment</title><desc id="d">A technician uses a moisture meter to test the substrate and site conditions.</desc>
<style>.t{font:700 24px Inter,Arial;fill:#12384b}.s{font:500 15px Inter,Arial;fill:#5c7380}.h{font:700 14px Inter,Arial;fill:#12384b}
.ring{animation:ring 1.7s ease-out infinite}.num{animation:num 2s ease-in-out infinite}.drop{animation:drop 1.5s ease-in-out infinite}
