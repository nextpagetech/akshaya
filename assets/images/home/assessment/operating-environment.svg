<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
<title id="t">Operating environment</title><desc id="d">Forklift traffic, machinery and loading zones demonstrate how the floor is actually used.</desc>
<style>.t{font:700 24px Inter,Arial;fill:#12384b}.s{font:500 15px Inter,Arial;fill:#5c7380}.h{font:700 14px Inter,Arial;fill:#12384b}
.route{stroke:#27a9da;stroke-width:8;stroke-dasharray:18 14;animation:dash 1.4s linear infinite}.fork{animation:fork 4.4s ease-in-out infinite alternate}.load{animation:load 1.8s ease-out infinite}
@keyframes dash{to{stroke-dashoffset:-64}}@keyframes fork{from{transform:translateX(0)}to{transform:translateX(360px)}}@keyframes load{75%{stroke-width:18;opacity:0}}</style>
<rect width="960" height="540" rx="28" fill="#f7fbfd"/><text class="t" x="48" y="52">03 · Operating Environment</text><text class="s" x="48" y="82">Understand traffic, machinery, loads and movement patterns that the floor must handle.</text>
<g transform="translate(50 120)">
<polygon points="65,60 770,20 835,340 115,380" fill="#d8e2e6" stroke="#aec3cd" stroke-width="2"/>
<g fill="#849ba7"><rect x="160" y="85" width="125" height="100" rx="8"/><rect x="340" y="70" width="135" height="110" rx="8"/><rect x="535" y="65" width="110" height="95" rx="8"/></g>
<path class="route" d="M120 300 C270 245 400 315 530 240 S710 188 775 225" fill="none"/>
<g class="fork" transform="translate(120 260)"><rect width="90" height="46" rx="8" fill="#f2b721"/><circle cx="20" cy="51" r="10" fill="#173746"/><circle cx="70" cy="51" r="10" fill="#173746"/><rect x="60" y="-35" width="10" height="38" fill="#173746"/><path d="M70 -30h40" stroke="#173746" stroke-width="7"/></g>
<g><rect x="650" y="245" width="115" height="70" rx="8" fill="#e7eef1" stroke="#f2b721" stroke-width="3"/><text class="h" x="708" y="285" text-anchor="middle">LOAD ZONE</text><circle class="load" cx="708" cy="280" r="48" fill="none" stroke="#f2b721" stroke-width="4"/></g>
<text class="h" x="175" y="350">TRAFFIC</text><text class="h" x="355" y="210">MACHINERY</text>
</g></svg>