<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
<title id="t">Final inspection</title><desc id="d">The completed floor is scanned and checked at multiple points before handover.</desc>
<style>.t{font:700 24px Inter,Arial;fill:#12384b}.s{font:500 15px Inter,Arial;fill:#5c7380}.h{font:700 14px Inter,Arial;fill:#12384b}.scan{animation:scan 2s ease-in-out infinite alternate}.check{animation:check 2.2s ease-out infinite}.b{animation-delay:.4s}.c{animation-delay:.8s}
@keyframes scan{from{transform:translateX(0)}to{transform:translateX(430px)}}@keyframes check{0%{transform:scale(.7);opacity:.25}35%,75%{transform:scale(1);opacity:1}100%{opacity:.3}}</style>
<rect width="960" height="540" rx="28" fill="#f7fbfd"/><text class="t" x="48" y="52">06 · Final Inspection</text><text class="s" x="48" y="82">Review the finished floor and verify completed areas before handover.</text>
<g transform="translate(60 120)">
<polygon points="70,60 760,30 820,340 110,375" fill="#d7e4e8" stroke="#aec3cd" stroke-width="2"/>
<g transform="translate(120 100)"><circle cx="30" cy="18" r="17" fill="#efc7a8"/><rect x="5" y="38" width="50" height="76" rx="14" fill="#dfff31"/><rect x="10" y="90" width="40" height="70" rx="8" fill="#173d59"/><rect x="58" y="55" width="55" height="42" rx="5" fill="#e5eef1" stroke="#174e68" stroke-width="3"/></g>
<rect class="scan" x="235" y="80" width="8" height="245" fill="#5bd3eb" filter="url(#glow)"/>
<defs><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<g class="check a" transform="translate(360 180)"><circle r="22" fill="#2ca568"/><path d="M-9 0l7 8 14-17" fill="none" stroke="#fff" stroke-width="6"/></g>
<g class="check b" transform="translate(530 255)"><circle r="22" fill="#2ca568"/><path d="M-9 0l7 8 14-17" fill="none" stroke="#fff" stroke-width="6"/></g>
<g class="check c" transform="translate(690 160)"><circle r="22" fill="#2ca568"/><path d="M-9 0l7 8 14-17" fill="none" stroke="#fff" stroke-width="6"/></g>
<text class="h" x="480" y="350">COMPLETED FLOOR REVIEW</text>
</g></svg>