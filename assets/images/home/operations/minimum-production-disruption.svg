<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
<title id="t">Minimum production disruption</title><desc id="d">Factory stays operational while one protected flooring work zone is isolated and the forklift route remains open.</desc>
<style>
.t{font:700 24px Inter,Arial;fill:#12384b}.s{font:500 15px Inter,Arial;fill:#5c7380}.lab{font:700 14px Inter,Arial;fill:#12384b}
.route{stroke:#24a7d8;stroke-width:9;stroke-linecap:round;stroke-dasharray:18 16;animation:dash 1.5s linear infinite}
.fork{animation:fork 4.4s ease-in-out infinite alternate}.coat{animation:coat 2.6s ease-in-out infinite alternate}.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes dash{to{stroke-dashoffset:-68}}@keyframes fork{from{transform:translateX(0)}to{transform:translateX(310px)}}@keyframes coat{from{opacity:.35}to{opacity:1}}@keyframes pulse{50%{filter:drop-shadow(0 0 10px #f2b721)}}
</style>
<rect width="960" height="540" rx="28" fill="#f7fbfd"/><text class="t" x="48" y="52">01 · Minimum Production Disruption</text>
<text class="s" x="48" y="82">Production keeps moving while a clearly separated flooring zone is under work.</text>
<g transform="translate(62 112)">
<polygon points="0,90 700,20 820,305 110,390" fill="#dfe8ec" stroke="#aac3cf" stroke-width="2"/>
<g fill="#8ba0aa"><rect x="80" y="110" width="115" height="85" rx="8"/><rect x="230" y="85" width="120" height="90" rx="8"/><rect x="385" y="70" width="112" height="82" rx="8"/></g>
<g fill="#cfdade"><rect x="100" y="85" width="75" height="30"/><rect x="250" y="60" width="78" height="28"/><rect x="405" y="45" width="72" height="26"/></g>
<path class="route" d="M100 290 C250 240 370 278 500 218 S690 178 760 208" fill="none"/>
<g class="fork" transform="translate(120 247)"><rect width="82" height="42" rx="8" fill="#f2b721"/><circle cx="18" cy="47" r="10" fill="#173746"/><circle cx="64" cy="47" r="10" fill="#173746"/><rect x="54" y="-32" width="10" height="34" fill="#173746"/><path d="M64 -26h34" stroke="#173746" stroke-width="7"/></g>
<g class="coat"><polygon points="505,255 710,225 755,322 545,350" fill="#6cc8dc" opacity=".75"/><path d="M515 270l200-28M525 292l198-29M535 315l193-28" stroke="#fff" stroke-opacity=".6" stroke-width="3"/></g>
<g class="pulse"><polygon points="482,235 724,200 777,340 525,373" fill="none" stroke="#f2b721" stroke-width="5" stroke-dasharray="14 10"/><text class="lab" x="548" y="210">PROTECTED WORK ZONE</text></g>
<g><circle cx="186" cy="330" r="18" fill="#28a96b"/><path d="M177 330l7 7 13-16" fill="none" stroke="#fff" stroke-width="5"/><text class="lab" x="212" y="336">Active route remains open</text></g>
</g></svg>