<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
<title id="t">Quality-controlled execution</title><desc id="d">Four visible quality checkpoints progress from substrate test through application control to final inspection.</desc>
<style>.t{font:700 24px Inter,Arial;fill:#12384b}.s{font:500 15px Inter,Arial;fill:#5c7380}.h{font:700 15px Inter,Arial;fill:#12384b}.sm{font:500 13px Inter,Arial;fill:#637c89}
.flow{stroke:#25a9da;stroke-width:6;stroke-dasharray:14 12;animation:dash 1.4s linear infinite}.step{opacity:.42;animation:step 6s ease-in-out infinite}.b{animation-delay:1.4s}.c{animation-delay:2.8s}.d4{animation-delay:4.2s}
@keyframes dash{to{stroke-dashoffset:-52}}@keyframes step{0%,18%,100%{opacity:.42}25%,43%{opacity:1;filter:drop-shadow(0 0 12px #65cbe3)}}</style>
<rect width="960" height="540" rx="28" fill="#f7fbfd"/><text class="t" x="48" y="52">02 · Quality-Controlled Execution</text><text class="s" x="48" y="82">Each critical stage is checked before the next stage proceeds.</text>
<path class="flow" d="M145 295H815" fill="none"/>
<g class="step a" transform="translate(80 160)"><rect width="170" height="205" rx="18" fill="#fff" stroke="#b8d2dc"/><circle cx="85" cy="60" r="34" fill="#e6f5fa"/><path d="M62 60h46M85 37v46" stroke="#1683b4" stroke-width="7"/><text class="h" x="85" y="120" text-anchor="middle">SURFACE TEST</text><text class="sm" x="85" y="148" text-anchor="middle">Check substrate</text><text class="sm" x="85" y="168" text-anchor="middle">and weak areas</text></g>
<g class="step b" transform="translate(286 160)"><rect width="170" height="205" rx="18" fill="#fff" stroke="#b8d2dc"/><circle cx="85" cy="60" r="34" fill="#e6f5fa"/><path d="M85 35c18 20 25 30 25 42a25 25 0 1 1-50 0c0-12 7-22 25-42z" fill="#37aee0"/><text class="h" x="85" y="120" text-anchor="middle">MOISTURE</text><text class="sm" x="85" y="148" text-anchor="middle">Verify site</text><text class="sm" x="85" y="168" text-anchor="middle">conditions</text></g>
<g class="step c" transform="translate(492 160)"><rect width="170" height="205" rx="18" fill="#fff" stroke="#b8d2dc"/><circle cx="85" cy="60" r="34" fill="#e6f5fa"/><path d="M55 75h60M65 48h40" stroke="#1683b4" stroke-width="8"/><text class="h" x="85" y="120" text-anchor="middle">APPLICATION</text><text class="sm" x="85" y="148" text-anchor="middle">Control mixing</text><text class="sm" x="85" y="168" text-anchor="middle">and coverage</text></g>
<g class="step d4" transform="translate(698 160)"><rect width="170" height="205" rx="18" fill="#fff" stroke="#f2b721" stroke-width="2"/><circle cx="85" cy="60" r="34" fill="#e9f8ef"/><path d="M67 61l12 12 25-29" fill="none" stroke="#2ca568" stroke-width="8"/><text class="h" x="85" y="120" text-anchor="middle">FINAL QA</text><text class="sm" x="85" y="148" text-anchor="middle">Inspect and</text><text class="sm" x="85" y="168" text-anchor="middle">approve finish</text></g>
</svg>